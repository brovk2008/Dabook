name: Release & Publish

# Triggered by a version tag push: git tag v0.2.27 && git push --tags
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight publish

jobs:
  # ── 1. Bump pyproject.toml version to match the tag ─────────────────────
  bump-version:
    name: Bump version in pyproject.toml
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow pushing the version-bump commit
    outputs:
      version: ${{ steps.extract.outputs.version }}

    steps:
      - name: Checkout main (full history so we can push)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: extract
        run: |
          TAG="${{ github.ref_name }}"          # e.g. v0.2.27
          VERSION="${TAG#v}"                    # strip leading 'v' → 0.2.27
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          echo "pyproject.toml now at version $VERSION"
          grep '^version' pyproject.toml

      - name: Commit and push version bump (skip if already correct)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet pyproject.toml; then
            echo "Version already correct — nothing to commit."
          else
            git add pyproject.toml
            git commit -m "chore: bump version to ${{ steps.extract.outputs.version }} [skip ci]"
            git push origin main
          fi

  # ── 2. Run lint gate before publishing ───────────────────────────────────
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest
    needs: bump-version

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # use the bumped commit

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: uv venv && uv pip install ".[dev]"
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # ── 3. Build the distribution packages ───────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [bump-version, lint]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # use the bumped commit

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: uv build

      - name: Verify version matches tag
        run: |
          EXPECTED="${{ needs.bump-version.outputs.version }}"
          WHEEL=$(ls dist/*.whl | head -1)
          if echo "$WHEEL" | grep -q "$EXPECTED"; then
            echo "Wheel version matches tag: $EXPECTED"
          else
            echo "Version mismatch! Expected $EXPECTED in $WHEEL"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  # ── 4. Publish to PyPI via OIDC (no secrets needed) ──────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/dabook/${{ needs.bump-version.outputs.version }}
    permissions:
      id-token: write   # MANDATORY for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # ── 5. Create a GitHub Release with auto-generated notes ─────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [bump-version, publish]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ needs.bump-version.outputs.version }}"
          generate_release_notes: true   # auto-pulls PRs and commits since last tag
          files: dist/*
