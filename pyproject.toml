[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dabook"
version = "1.0.19"
description = "Compile any book-like document into a traceable, validated, editable Book Graph and export as ML-ready datasets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Vaibhav" }]
keywords = ["pdf", "book", "dataset", "nlp", "ml", "rag", "llm"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
]

dependencies = [
  # Core
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.7",
  "orjson>=3.10",
  "portalocker>=2.10",
  # Server / dashboard
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  # PDF (permissive-licensed defaults)
  "pypdfium2>=4",
  "pdfminer.six>=20231228",
  "pikepdf>=9",
  # Text processing
  "ftfy>=6",
  "regex>=2024",
  "rapidfuzz>=3",
  # Hashing / dedup
  "datasketch>=1.6",
  # Data / export
  "pyarrow>=16",
  # System telemetry
  "psutil>=6",
  # Tokenization (for chunking)
  "tiktoken>=0.7",
  # HTTP for model downloads / LLM providers
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/brovk2008/Dabook"
Repository = "https://github.com/brovk2008/Dabook.git"
Issues = "https://github.com/brovk2008/Dabook/issues"
Changelog = "https://github.com/brovk2008/Dabook/blob/main/CHANGELOG.md"
Documentation = "https://github.com/brovk2008/Dabook#readme"

[project.optional-dependencies]
docling = ["docling>=2"]
marker = ["marker-pdf>=1"]          # OpenRAIL-M weights — see license warning in docs
mineru = ["magic-pdf>=0.9"]
olmocr = ["olmocr>=0.1"]
gpu = ["nvidia-ml-py>=12"]
langid = ["lingua-language-detector>=2"]
llm = ["openai>=1", "anthropic>=0.28"]
datasets = ["datasets>=2.20"]
treesitter = ["tree-sitter>=0.22", "tree-sitter-python>=0.21"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-benchmark>=4",
  "pytest-xdist>=3",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-psutil",
  "reportlab>=4",      # generate test PDFs
  "playwright>=1.44",  # dashboard smoke tests
  "coverage[toml]>=7",
]

[project.scripts]
dabook = "dabook.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dabook"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["dabook"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --tb=short"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["dabook"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
